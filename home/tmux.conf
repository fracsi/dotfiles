# ── Prefix Key ──────────────────────────
set -g prefix C-b
set -g prefix2 C-a
bind C-a send-prefix

# ── General Settings ─────────────────────
set -g mouse on
set -g history-limit 10000
set -g base-index 0
setw -g pane-base-index 0

# ── Status Bar ────────────────────────────
set -g status-position bottom
set -g status-interval 1
set -g status-left " #S "
set -g status-right '#h %Y-%m-%d %H:%M'

# ── Terminal Colors ──────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"


# ── Custom Configs ───────────────────────
set -g automatic-rename on
set -g automatic-rename-format "#{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}}"

# ── Key bindings ─────────────────────────
bind-key -n M-PageUp previous-window
bind-key -n M-PageDown next-window
bind-key " " choose-window
bind-key Escape copy-mode

# ── TPM and Theme ────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux'
set -g @dracula-refresh-rate 1
set -g @dracula-show-left-icon "#h | #S"
set -g @dracula-show-powerline false
set -g @dracula-show-flags false
set -g @dracula-show-empty-plugins true
set -g @dracula-show-edge-icons false
set -g @dracula-show-battery-status false
set -g @dracula-no-battery-label false
set -g @dracula-plugins " "

run '~/.tmux/plugins/tpm/tpm'
